<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <button type="button" class="cambia-tema secondario" title="Cambia tema">Tema scuro</button>

    <header>
        <a href="index.html" id="indietro">&larr; Tutti i progetti</a>
        <h1 id="nome-progetto">Progetto</h1>
        <p id="descrizione-progetto" class="sottotitolo"></p>
        <div class="azioni centrate">
            <button type="button" id="modifica-progetto" class="secondario">Modifica progetto</button>
            <button type="button" id="elimina-progetto" class="elimina">Elimina progetto</button>
        </div>

        <ul id="partecipanti-progetto" class="chips"></ul>
        <form id="form-partecipante" class="riga-input">
            <input type="text" name="nome" placeholder="Aggiungi partecipante" required>
            <select name="ruolo" class="scelta-ruolo"></select>
            <button type="submit" class="secondario">+</button>
        </form>
    </header>

    <div id="barra-strumenti">
        <input type="search" id="cerca" placeholder="Cerca per titolo...">
        <select id="filtro-persona"></select>
        <select id="filtro-categoria"></select>
        <button type="button" id="apri-finestra">+ Nuova attività</button>
        <button type="button" id="esporta" class="secondario">Esporta</button>
        <button type="button" id="importa" class="secondario">Importa</button>
        <input type="file" id="file-importa" accept=".json,application/json" hidden>
    </div>

    <main id="board">
        <section class="colonna" id="todo">
            <h2>Da fare <span class="contatore">0</span></h2>
            <div class="lista"></div>
        </section>

        <section class="colonna" id="doing">
            <h2>In corso <span class="contatore">0</span></h2>
            <div class="lista"></div>
        </section>

        <section class="colonna" id="done">
            <h2>Fatto <span class="contatore">0</span></h2>
            <div class="lista"></div>
        </section>
    </main>

    <div id="sotto-board">
        <section id="calendario" class="pannello">
            <div class="testa-calendario">
                <button type="button" id="mese-precedente" class="secondario" title="Mese precedente">&larr;</button>
                <h2 id="titolo-mese"></h2>
                <button type="button" id="mese-successivo" class="secondario" title="Mese successivo">&rarr;</button>
            </div>
            <div class="griglia-calendario giorni-settimana">
                <span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span>
            </div>
            <div id="giorni" class="griglia-calendario"></div>
        </section>

        <section id="riepilogo" class="pannello">
            <h2>Ore per persona</h2>
            <table>
                <thead>
                    <tr>
                        <th>Persona</th>
                        <th>Attività</th>
                        <th>Ore totali</th>
                        <th>Ore completate</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </div>

    <dialog id="finestra-attivita">
        <h2 id="titolo-finestra">Nuova attività</h2>
        <form id="form-nuova" method="dialog">
            <label for="titolo">Titolo</label>
            <input type="text" id="titolo" name="titolo" placeholder="Titolo dell'attività" required>

            <label for="descrizione">Descrizione</label>
            <textarea id="descrizione" name="descrizione" rows="3" placeholder="Descrizione"></textarea>

            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" name="categoria" list="elenco-categorie" required>
            <datalist id="elenco-categorie"></datalist>

            <label for="persona">Assegnata a</label>
            <select id="persona" name="persona" required></select>

            <label for="professionista">Tipo di professionista</label>
            <select id="professionista" name="professionista" required></select>

            <div class="tre-colonne">
                <div>
                    <label for="durata">Durata (ore)</label>
                    <input type="number" id="durata" name="durata" min="1" required>
                </div>
                <div>
                    <label for="priorita">Priorità</label>
                    <select id="priorita" name="priorita">
                        <option value="bassa">Bassa</option>
                        <option value="media" selected>Media</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>
                <div>
                    <label for="scadenza">Scadenza</label>
                    <input type="date" id="scadenza" name="scadenza">
                </div>
            </div>

            <div class="azioni">
                <button type="submit" id="conferma">Aggiungi</button>
                <button type="button" id="annulla">Annulla</button>
            </div>
        </form>
    </dialog>
</body>
</html>
